name: Check application
on:
  push:
    branches: [main, staging]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:local
      - name: Verify database and API
        run: |
          npm run worker > /tmp/cape-fear-worker.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/config; then break; fi
            sleep 1
          done
          npm run test:integration
          npm run test:classroom
